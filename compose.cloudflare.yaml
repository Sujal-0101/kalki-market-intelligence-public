services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
    profiles: [exposure]
    restart: unless-stopped
    command:
      - tunnel
      - --loglevel
      - info
      - --metrics
      - 127.0.0.1:20241
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      - public_connector
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:20241
        - ready
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
